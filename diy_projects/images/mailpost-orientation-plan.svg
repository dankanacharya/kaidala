<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="620" height="400" role="img" aria-label="Plan view comparing the two orientations. On the left the posts run parallel to the street and present a 31 inch panel to the road with the mailbox cantilevered toward it. On the right the posts run perpendicular to the street, presenting a three and a half inch edge, with the mailbox carried on a platform spanning both posts.">
  <rect x="0" y="0" width="620" height="400" fill="#FCFBF8"/>
  <rect x="0.5" y="0.5" width="619" height="399" fill="none" stroke="#E4E0D7"/>

  <text x="310" y="30" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#2B2B2B">Plan &#8212; the two orientations</text>
  <text x="310" y="48" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7A756B">Viewed from above &#183; scale 3 px = 1&#8243; &#183; the mailbox door faces the road in both</text>

  <text x="165" y="76" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2B2B2B">A &#8212; parallel to the street</text>
  <text x="165" y="93" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7A756B">a sign facing the road</text>
  <text x="455" y="76" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2B2B2B">B &#8212; perpendicular to the street</text>
  <text x="455" y="93" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7A756B">an edge to the road, a sign to each approach</text>

  <g transform="translate(0,-112)">
  <line x1="310" y1="215" x2="310" y2="492" stroke="#E4E0D7" stroke-width="1"/>

  <!-- road and kerb -->
  <rect x="20" y="430" width="580" height="60" fill="#D6D2CA"/>
  <rect x="20" y="412" width="580" height="18" fill="#CFCAC0" stroke="#B8B2A6" stroke-width="1"/>
  <line x1="20" y1="430" x2="600" y2="430" stroke="#2B2B2B" stroke-width="2"/>
  <text x="310" y="466" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#5A5650">STREET</text>
  <text x="30" y="425" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5A5650">kerb</text>

  <!-- ============ A: parallel ============ -->
  <!-- beam above, dashed -->
  <rect x="109.5" y="342" width="111" height="10.5" fill="none" stroke="#A89880" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- posts -->
  <rect x="118.5" y="346" width="10.5" height="10.5" fill="#D9BC8E" stroke="#6B4A2A" stroke-width="1"/>
  <rect x="201" y="346" width="10.5" height="10.5" fill="#D9BC8E" stroke="#6B4A2A" stroke-width="1"/>
  <!-- panel -->
  <rect x="129" y="346" width="72" height="3" fill="#E3CBA3" stroke="#6B4A2A" stroke-width="1"/>
  <!-- plaque on the panel face -->
  <rect x="141.75" y="343" width="47.25" height="3" fill="#FAF7EF" stroke="#8A8578" stroke-width="1"/>
  <!-- mailbox cantilevered toward the road -->
  <rect x="150.75" y="346" width="28.5" height="63" fill="#3A3A3A" stroke="#1F1F1F" stroke-width="1"/>
  <rect x="150.75" y="403" width="28.5" height="6" fill="#5E5E5E" stroke="#1F1F1F" stroke-width="1"/>
  <text x="185" y="380" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5A5650">21&#8243; cantilever</text>

  <!-- A dimensions -->
  <g stroke="#7A756B" stroke-width="0.8" fill="none">
    <path d="M118.5,320 L211.5,320"/><path d="M118.5,315 L118.5,325"/><path d="M211.5,315 L211.5,325"/>
    <path d="M118.5,325 L118.5,344" stroke-dasharray="3 3"/><path d="M211.5,325 L211.5,344" stroke-dasharray="3 3"/>
    <path d="M232,409 L232,430"/><path d="M227,409 L237,409"/><path d="M227,430 L237,430"/>
    <path d="M179.25,409 L233,409" stroke-dasharray="3 3"/>
  </g>
  <text x="165" y="313" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#2B2B2B">31&#8243; facing the road</text>
  <text x="241" y="423" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5A5650">7&#8243;</text>

  <!-- ============ B: perpendicular ============ -->
  <!-- beam above, dashed -->
  <rect x="449.75" y="305" width="10.5" height="111" fill="none" stroke="#A89880" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- platform above, dashed -->
  <rect x="441.5" y="311" width="27.75" height="99" fill="none" stroke="#A89880" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- posts, in line -->
  <rect x="449.75" y="397" width="10.5" height="10.5" fill="#D9BC8E" stroke="#6B4A2A" stroke-width="1"/>
  <rect x="449.75" y="314.5" width="10.5" height="10.5" fill="#D9BC8E" stroke="#6B4A2A" stroke-width="1"/>
  <!-- side panels, one each side -->
  <rect x="447" y="314.5" width="2.75" height="93" fill="#E3CBA3" stroke="#6B4A2A" stroke-width="0.8"/>
  <rect x="460.25" y="314.5" width="2.75" height="93" fill="#E3CBA3" stroke="#6B4A2A" stroke-width="0.8"/>
  <!-- plaques, one each side -->
  <rect x="443.5" y="337.5" width="3.5" height="47.25" fill="#FAF7EF" stroke="#6E6A5E" stroke-width="1"/>
  <rect x="463" y="337.5" width="3.5" height="47.25" fill="#FAF7EF" stroke="#6E6A5E" stroke-width="1"/>
  <!-- mailbox on the platform -->
  <rect x="440.75" y="346" width="28.5" height="63" fill="#3A3A3A" stroke="#1F1F1F" stroke-width="1"/>
  <rect x="440.75" y="403" width="28.5" height="6" fill="#5E5E5E" stroke="#1F1F1F" stroke-width="1"/>

  <!-- B dimensions -->
  <g stroke="#7A756B" stroke-width="0.8" fill="none">
    <path d="M520,314.5 L520,407.5"/><path d="M515,314.5 L525,314.5"/><path d="M515,407.5 L525,407.5"/>
    <path d="M463,314.5 L521,314.5" stroke-dasharray="3 3"/><path d="M463,407.5 L521,407.5" stroke-dasharray="3 3"/>
    <path d="M449.75,300 L460.25,300"/><path d="M449.75,295 L449.75,305"/><path d="M460.25,295 L460.25,305"/>
    <path d="M496,409 L496,430"/><path d="M491,409 L501,409"/><path d="M491,430 L501,430"/>
    <path d="M469.25,409 L497,409" stroke-dasharray="3 3"/>
  </g>
  <text x="529" y="356" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#2B2B2B">31&#8243;</text>
  <text x="529" y="371" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#2B2B2B">deep</text>
  <text x="455" y="291" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#2B2B2B">3&#189;&#8243; facing the road</text>
  <text x="505" y="423" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5A5650">7&#8243;</text>
  <text x="378" y="352" text-anchor="end" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5A5650">two plaques,</text>
  <text x="378" y="365" text-anchor="end" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5A5650">one per side</text>
  <g stroke="#7A756B" stroke-width="0.7" fill="none">
    <path d="M382,356 L442,348"/><path d="M382,360 L462,374"/>
  </g>
  <text x="310" y="486" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#7A756B">7&#8243; = kerb face to the mailbox door, mid-range of the USPS 6&#8211;8&#8243; setback</text>
  </g>
</svg>
