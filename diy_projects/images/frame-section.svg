<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" width="660" height="350" role="img" aria-label="Cross-section through the frame edge showing two three-quarter inch lattice layers filling the one and a half inch frame">
  <rect x="0" y="0" width="660" height="350" fill="#FCFBF8"/>
  <rect x="0.5" y="0.5" width="659" height="349" fill="none" stroke="#E4E0D7"/>

  <text x="330" y="30" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#2B2B2B">Section through the frame edge</text>

  <!-- upper layer -->
  <rect x="120" y="95" width="350" height="30" fill="#E8D5B0" stroke="#8B6B45" stroke-width="1"/>
  <!-- lower layer -->
  <rect x="120" y="125" width="350" height="30" fill="#D4B98A" stroke="#8B6B45" stroke-width="1"/>

  <!-- frame, cut -->
  <rect x="90" y="95" width="30" height="60" fill="#C89B6A" stroke="#6B4A2A" stroke-width="1.2"/>
  <g stroke="#A87B4A" stroke-width="0.8">
    <line x1="90" y1="110" x2="105" y2="95"/>
    <line x1="90" y1="125" x2="120" y2="95"/>
    <line x1="90" y1="140" x2="120" y2="110"/>
    <line x1="90" y1="155" x2="120" y2="125"/>
    <line x1="105" y1="155" x2="120" y2="140"/>
  </g>

  <!-- screw hook -->
  <line x1="300" y1="100" x2="300" y2="155" stroke="#8A8A8A" stroke-width="3" stroke-dasharray="5 3"/>
  <path d="M300,155 v18 a11,11 0 1,0 22,0 v-7" stroke="#7A7A7A" stroke-width="3" fill="none"/>

  <!-- dimension: hook penetration -->
  <line x1="355" y1="100" x2="355" y2="155" stroke="#5A5A5A" stroke-width="1"/>
  <polygon points="355,100 351.5,107 358.5,107" fill="#5A5A5A"/>
  <polygon points="355,155 351.5,148 358.5,148" fill="#5A5A5A"/>
  <text x="346" y="127" text-anchor="middle" transform="rotate(-90 346 127)" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#3A3A3A">1⅜″</text>

  <!-- dimension: frame thickness 3/4 -->
  <g stroke="#CFC9BC" stroke-width="1">
    <line x1="90" y1="93" x2="90" y2="66"/>
    <line x1="120" y1="93" x2="120" y2="66"/>
  </g>
  <line x1="70" y1="72" x2="140" y2="72" stroke="#6B6B6B" stroke-width="1"/>
  <polygon points="90,72 82,68.5 82,75.5" fill="#6B6B6B"/>
  <polygon points="120,72 128,68.5 128,75.5" fill="#6B6B6B"/>
  <text x="105" y="62" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#3A3A3A">¾″</text>

  <!-- dimension: frame height 1 1/2 -->
  <line x1="60" y1="95" x2="60" y2="155" stroke="#6B6B6B" stroke-width="1"/>
  <polygon points="60,95 56.5,103 63.5,103" fill="#6B6B6B"/>
  <polygon points="60,155 56.5,147 63.5,147" fill="#6B6B6B"/>
  <text x="50" y="125" text-anchor="middle" transform="rotate(-90 50 125)" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#3A3A3A">1½″</text>

  <!-- dimensions: layer thicknesses -->
  <g stroke="#CFC9BC" stroke-width="1">
    <line x1="470" y1="95" x2="500" y2="95"/>
    <line x1="470" y1="125" x2="500" y2="125"/>
    <line x1="470" y1="155" x2="500" y2="155"/>
  </g>
  <g stroke="#6B6B6B" stroke-width="1">
    <line x1="495" y1="95" x2="495" y2="125"/>
    <line x1="495" y1="125" x2="495" y2="155"/>
  </g>
  <polygon points="495,95 491.5,102 498.5,102" fill="#6B6B6B"/>
  <polygon points="495,125 491.5,118 498.5,118" fill="#6B6B6B"/>
  <polygon points="495,125 491.5,132 498.5,132" fill="#6B6B6B"/>
  <polygon points="495,155 491.5,148 498.5,148" fill="#6B6B6B"/>
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#3A3A3A">
    <text x="506" y="114">¾″ upper layer</text>
    <text x="506" y="144">¾″ lower layer</text>
  </g>

  <!-- callouts -->
  <g stroke="#A8A296" stroke-width="1" fill="none">
    <path d="M105,157 L95,205"/>
    <path d="M322,190 L392,214"/>
  </g>
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#3A3A3A">
    <text x="60" y="220">1x2 frame, standing on edge</text>
    <text x="398" y="211">Screw hook — up through the lower strip,</text>
    <text x="398" y="226">⅝″ into the upper: 1⅜″ of thread in all</text>
  </g>

  <text x="330" y="290" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#3A3A3A">Two ¾″ layers exactly fill the 1½″ frame.</text>
  <text x="330" y="311" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#7A756B">No half-lap joints, no notching — the hooks lock the two layers together.</text>
</svg>
