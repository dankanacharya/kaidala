<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 640" width="620" height="640" role="img" aria-label="Side elevation of the parallel design, street to the left, showing the mailbox cantilevered 21 inches toward the road on a 2x10 platform with two knee braces running back down to the panel at 30 inches">
  <rect x="0" y="0" width="620" height="640" fill="#FCFBF8"/>
  <rect x="0.5" y="0.5" width="619" height="639" fill="none" stroke="#E4E0D7"/>

  <text x="310" y="32" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#2B2B2B">A &#8212; side elevation</text>
  <text x="310" y="50" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7A756B">Street to the left &#183; panel, plaque and rails shown through the post &#183; scale 6 px = 1&#8243;</text>

  <!-- USPS band -->
  <rect x="120" y="242" width="380" height="24" fill="#BFD9C4" opacity="0.5"/>
  <line x1="120" y1="242" x2="500" y2="242" stroke="#5C8A67" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line x1="120" y1="266" x2="500" y2="266" stroke="#5C8A67" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="124" y="238" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#3F6349">USPS 41&#8211;45&#8243;</text>

  <!-- street arrow -->
  <g stroke="#5A5650" stroke-width="1.4" fill="none">
    <path d="M150,478 L100,478"/><path d="M108,472 L100,478 L108,484"/>
  </g>
  <text x="152" y="482" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A5650">street</text>

  <!-- post, seen edge-on: only one post is visible, the other is directly behind -->
  <rect x="390" y="173" width="21" height="351" fill="#D9BC8E" stroke="#6B4A2A" stroke-width="1"/>
  <g stroke="#C4A87F" stroke-width="0.8">
    <line x1="401" y1="173" x2="401" y2="524"/>
  </g>

  <!-- rails behind the panel -->
  <g fill="#C89B6A" stroke="#6B4A2A" stroke-width="0.9">
    <rect x="394.5" y="173" width="9" height="21"/>
    <rect x="394.5" y="194" width="9" height="21"/>
    <rect x="394.5" y="233" width="9" height="21"/>
    <rect x="394.5" y="302" width="9" height="21"/>
    <rect x="394.5" y="323" width="9" height="21"/>
    <rect x="394.5" y="368" width="9" height="21"/>
    <rect x="394.5" y="431" width="9" height="21"/>
  </g>

  <!-- panel skin, front face flush with the post face -->
  <rect x="390" y="173" width="4.5" height="279" fill="#F0DCB8" stroke="#6B4A2A" stroke-width="1"/>

  <!-- beam, set forward 3/4 inch -->
  <rect x="385.5" y="152" width="21" height="21" fill="#C89B6A" stroke="#6B4A2A" stroke-width="1"/>
  <g stroke="#4A4A4A" stroke-width="1">
    <rect x="387" y="146" width="18" height="6" fill="#4A4A4A"/>
    <rect x="389" y="139" width="14" height="7" fill="#FFF3C4"/>
  </g>

  <!-- light spill -->
  <path d="M368,196 L385,186 L385,242 L372,242 Z" fill="#FFF3C4" opacity="0.4"/>
  <!-- visor -->
  <g transform="rotate(-20 385.5 175)">
    <rect x="355.5" y="175" width="30" height="5" fill="#C89B6A" stroke="#6B4A2A" stroke-width="0.9"/>
  </g>

  <!-- plaque, on the panel face -->
  <rect x="383" y="192.5" width="2.8" height="46.5" fill="#FAF7EF" stroke="#8A8578" stroke-width="1"/>

  <!-- knee braces -->
  <g fill="#C89B6A" stroke="#6B4A2A" stroke-width="1">
    <path d="M301.5,311 L390,373 L390,382 L301.5,320 Z"/>
  </g>

  <!-- platform: 2x10 laid flat, 26 inches long -->
  <rect x="253.5" y="302" width="156" height="9" fill="#C89B6A" stroke="#6B4A2A" stroke-width="1"/>

  <!-- mailbox: 21 inches deep, door at the street end -->
  <rect x="259.5" y="245" width="126" height="57" fill="#3A3A3A" stroke="#1F1F1F" stroke-width="1"/>
  <path d="M259.5,251 L385.5,247" stroke="#6E6E6E" stroke-width="1" fill="none"/>
  <rect x="259.5" y="245" width="7" height="57" fill="#5E5E5E" stroke="#1F1F1F" stroke-width="1"/>
  <text x="325" y="292" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#B9B9B9">21&#8243; deep &#8212; door to the street</text>

  <!-- ground and road -->
  <line x1="150" y1="524" x2="500" y2="524" stroke="#2B2B2B" stroke-width="2"/>
  <g stroke="#B8B2A6" stroke-width="1">
    <line x1="170" y1="524" x2="162" y2="534"/><line x1="220" y1="524" x2="212" y2="534"/>
    <line x1="270" y1="524" x2="262" y2="534"/><line x1="320" y1="524" x2="312" y2="534"/>
    <line x1="370" y1="524" x2="362" y2="534"/><line x1="420" y1="524" x2="412" y2="534"/>
    <line x1="470" y1="524" x2="462" y2="534"/>
  </g>
  <line x1="130" y1="560" x2="510" y2="560" stroke="#5A5650" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="320" y="576" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#2B2B2B">road surface &#8212; the datum USPS measures from</text>

  <!-- cantilever dimension -->
  <g stroke="#7A756B" stroke-width="0.8" fill="none">
    <path d="M259.5,222 L385.5,222"/><path d="M259.5,217 L259.5,227"/><path d="M385.5,217 L385.5,227"/>
    <path d="M259.5,227 L259.5,243" stroke-dasharray="3 3"/>
    <path d="M301.5,336 L390,336"/><path d="M301.5,331 L301.5,341"/><path d="M390,331 L390,341"/>
  </g>
  <text x="322" y="216" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2B2B2B">21&#8243; of cantilever</text>
  <text x="345" y="352" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A5650">14&#8243; brace run</text>

  <!-- callouts -->
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#5A5650">
    <g stroke="#7A756B" stroke-width="0.8" fill="none">
      <path d="M406.5,152 L440,152"/>
      <path d="M365,190 L440,186"/>
      <path d="M403.5,215 L440,232"/>
      <path d="M409.5,306 L440,296"/>
      <path d="M345,377 L440,404"/>
      <path d="M403.5,441 L440,452"/>
      <path d="M259.5,306 L254,424"/>
    </g>
    <text x="445" y="149">68&#8243; &#8212; beam top</text>
    <text x="445" y="183">Solar-lit visor</text>
    <text x="445" y="229">Rails behind the panel;</text>
    <text x="445" y="243">R4+R5 stack to give 7&#8243;</text>
    <text x="445" y="257">of backing here</text>
    <text x="445" y="293">2x10 platform,</text>
    <text x="445" y="307">26&#8243; long, top at 43&#8243;</text>
    <text x="445" y="401">Two knee braces to</text>
    <text x="445" y="415">R6 at 30&#8243; &#8212; these are</text>
    <text x="445" y="429">what make it stiff</text>
    <text x="445" y="456">18&#8243; &#8212; panel bottom</text>
  </g>
  <text x="250" y="428" text-anchor="end" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A5650">Door face sits 7&#8243; back</text>
  <text x="250" y="442" text-anchor="end" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A5650">from the kerb face</text>

  <!-- height bracket -->
  <g stroke="#7A756B" stroke-width="0.8" fill="none">
    <path d="M180,152 L180,560"/><path d="M175,152 L185,152"/><path d="M175,560 L185,560"/>
  </g>
  <text x="166" y="356" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2B2B2B" transform="rotate(-90 166 356)">68&#8243; above the road</text>

  <text x="310" y="612" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#7A756B">One post shown &#8212; the second stands directly behind it, 27&#189;&#8243; away on centre</text>
</svg>
