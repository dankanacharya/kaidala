<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" width="620" height="500" role="img" aria-label="Side section through the top of the post, street to the left, showing the 4x4 beam sitting on the post with a three-quarter inch drip overhang, the panel board flush with the post face, the rails set back three quarters of an inch, and the cedar visor tilted twenty degrees down and forward carrying an LED strip wired to a solar panel on the beam top">
  <rect x="0" y="0" width="620" height="500" fill="#FCFBF8"/>
  <rect x="0.5" y="0.5" width="619" height="499" fill="none" stroke="#E4E0D7"/>

  <text x="310" y="32" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#2B2B2B">Section through the top &#8212; street to the left</text>
  <text x="310" y="50" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7A756B">Cut on the bay centreline &#183; scale 20 px = 1&#8243;</text>

  <!-- light spill from the visor down the panel face -->
  <path d="M162,224 L256,190 L256,400 L200,400 Z" fill="#FFF3C4" opacity="0.45"/>

  <!-- post -->
  <rect x="250" y="170" width="70" height="230" fill="#D9BC8E" stroke="#6B4A2A" stroke-width="1.2"/>
  <g stroke="#C4A87F" stroke-width="0.8">
    <line x1="286" y1="170" x2="286" y2="400"/><line x1="304" y1="170" x2="304" y2="400"/>
  </g>

  <!-- rails, set back 3/4" from the post face -->
  <rect x="265" y="170" width="30" height="70" fill="#C89B6A" stroke="#6B4A2A" stroke-width="1.2"/>
  <rect x="265" y="240" width="30" height="70" fill="#C89B6A" stroke="#6B4A2A" stroke-width="1.2"/>

  <!-- panel board, front face flush with the post face -->
  <rect x="250" y="170" width="15" height="230" fill="#F0DCB8" stroke="#6B4A2A" stroke-width="1.2"/>

  <!-- ceramic plaque on the panel face -->
  <rect x="242" y="300" width="8" height="80" fill="#FAF7EF" stroke="#8A8578" stroke-width="1.2"/>

  <!-- beam, set forward 3/4" of the post face -->
  <rect x="240" y="100" width="70" height="70" fill="#C89B6A" stroke="#6B4A2A" stroke-width="1.2"/>
  <line x1="240" y1="130" x2="310" y2="130" stroke="#A87B4A" stroke-width="0.8"/>

  <!-- structural screw down into the post end grain -->
  <path d="M276,106 L276,250" stroke="#4A4A4A" stroke-width="2" fill="none"/>
  <circle cx="276" cy="106" r="4" fill="#4A4A4A"/>

  <!-- solar panel on the beam top -->
  <rect x="250" y="90" width="52" height="10" fill="#2E3A4A" stroke="#1F2733" stroke-width="1"/>
  <g stroke="#5A7391" stroke-width="0.8">
    <line x1="263" y1="90" x2="263" y2="100"/><line x1="276" y1="90" x2="276" y2="100"/>
    <line x1="289" y1="90" x2="289" y2="100"/>
  </g>

  <!-- hidden wire run: down the beam back face, forward along the underside -->
  <path d="M302,95 L308,95 L308,164 L253,164 L251,176" stroke="#3A3A3A" stroke-width="1.6" fill="none" stroke-dasharray="5 3"/>

  <!-- visor: 5" board tilted 20 degrees down and forward -->
  <g transform="rotate(-20 250 172)">
    <rect x="150" y="172" width="100" height="15" fill="#C89B6A" stroke="#6B4A2A" stroke-width="1.2"/>
    <rect x="156" y="187" width="88" height="4" fill="#E8B93A" stroke="#B8912A" stroke-width="0.6"/>
  </g>

  <!-- dimensions -->
  <g stroke="#7A756B" stroke-width="0.8" fill="none">
    <path d="M240,78 L240,88"/><path d="M250,78 L250,88"/><path d="M240,83 L250,83"/>
    <path d="M250,452 L320,452"/><path d="M250,447 L250,457"/><path d="M320,447 L320,457"/>
    <path d="M265,420 L295,420"/><path d="M265,415 L265,425"/><path d="M295,415 L295,425"/>
    <path d="M310,100 L392,100" stroke-dasharray="3 3"/><path d="M310,170 L392,170" stroke-dasharray="3 3"/>
    <path d="M386,100 L386,170"/><path d="M381,100 L391,100"/><path d="M381,170 L391,170"/>
  </g>
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A5650">
    <text x="236" y="74" text-anchor="end">&#190;&#8243; drip overhang</text>
    <text x="285" y="472" text-anchor="middle">4x4 post &#8212; 3&#189;&#8243;</text>
    <text x="302" y="424">rail 1&#189;&#8243;</text>
    <text x="397" y="139">beam 3&#189;&#8243;</text>
  </g>

  <!-- right-hand leaders and labels -->
  <g stroke="#7A756B" stroke-width="0.7" fill="none">
    <path d="M300,93 L414,84"/>
    <path d="M308,166 L414,196"/>
  </g>
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A5650">
    <text x="419" y="81">Solar panel screwed flat</text>
    <text x="419" y="95">to the beam top</text>
    <text x="419" y="193">Wire in a &#8540;&#8243; groove &#8212;</text>
    <text x="419" y="207">down the beam back,</text>
    <text x="419" y="221">then along the underside</text>
  </g>

  <!-- left-hand leaders and labels -->
  <g stroke="#7A756B" stroke-width="0.7" fill="none">
    <path d="M180,196 L152,192"/>
    <path d="M205,232 L152,264"/>
    <path d="M254,332 L152,326"/>
    <path d="M242,352 L152,384"/>
  </g>
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A5650" text-anchor="end">
    <text x="147" y="182">Cedar visor &#190;&#8243; &#215; 5&#8243; &#215; 20&#8243;,</text>
    <text x="147" y="196">tilted 20&#176; down and forward</text>
    <text x="147" y="261">Waterproof warm-white LED</text>
    <text x="147" y="275">strip taped to the underside</text>
    <text x="147" y="323">Panel board &#190;&#8243;, front face</text>
    <text x="147" y="337">flush with the post face</text>
    <text x="147" y="388">Ceramic plaque</text>
  </g>
</svg>
