<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350" role="img" aria-label="Leg to frame joint: plan view at the corner and two leg elevations showing insert heights of half an inch and one inch">
  <rect x="0" y="0" width="700" height="350" fill="#FCFBF8"/>
  <rect x="0.5" y="0.5" width="699" height="349" fill="none" stroke="#E4E0D7"/>

  <text x="350" y="28" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#2B2B2B">Leg-to-frame joint — one insert per face, two adjacent faces</text>

  <text x="185" y="52" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#6B6B6B">Plan at the corner</text>
  <text x="505" y="52" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#6B6B6B">Insert heights, from the top of the leg</text>

  <!-- ============ plan view ============ -->
  <rect x="70" y="95" width="230" height="37.5" fill="#C89B6A" stroke="#6B4A2A" stroke-width="1"/>
  <rect x="70" y="95" width="37.5" height="190" fill="#C89B6A" stroke="#6B4A2A" stroke-width="1"/>
  <rect x="107.5" y="132.5" width="75" height="75" fill="#B98A55" stroke="#6B4A2A" stroke-width="1.2"/>
  <text x="152" y="198" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#4A3419">leg</text>

  <!-- inserts -->
  <rect x="139" y="132.5" width="12" height="25" fill="#9AA0A6" stroke="#5A6066" stroke-width="1"/>
  <rect x="107.5" y="164" width="25" height="12" fill="#9AA0A6" stroke="#5A6066" stroke-width="1"/>

  <!-- bolts -->
  <line x1="145" y1="91" x2="145" y2="157.5" stroke="#3A3A3A" stroke-width="3"/>
  <rect x="138" y="87" width="14" height="7" fill="#3A3A3A"/>
  <line x1="67" y1="170" x2="157.5" y2="170" stroke="#3A3A3A" stroke-width="3"/>
  <rect x="63" y="163" width="7" height="14" fill="#3A3A3A"/>

  <!-- dim: 1 1/2 in from the outside corner, both ways -->
  <g stroke="#CFC9BC" stroke-width="1">
    <line x1="70" y1="93" x2="70" y2="70"/>
    <line x1="145" y1="79" x2="145" y2="70"/>
    <line x1="68" y1="95" x2="50" y2="95"/>
    <line x1="68" y1="170" x2="50" y2="170"/>
  </g>
  <line x1="70" y1="75" x2="145" y2="75" stroke="#6B6B6B" stroke-width="1"/>
  <polygon points="70,75 78,71.5 78,78.5" fill="#6B6B6B"/>
  <polygon points="145,75 137,71.5 137,78.5" fill="#6B6B6B"/>
  <text x="107" y="68" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#3A3A3A">1½″</text>

  <line x1="55" y1="95" x2="55" y2="170" stroke="#6B6B6B" stroke-width="1"/>
  <polygon points="55,95 51.5,103 58.5,103" fill="#6B6B6B"/>
  <polygon points="55,170 51.5,162 58.5,162" fill="#6B6B6B"/>
  <text x="46" y="132" text-anchor="middle" transform="rotate(-90 46 132)" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#3A3A3A">1½″</text>

  <!-- plan callouts -->
  <g stroke="#A8A296" stroke-width="1" fill="none">
    <path d="M270,133 L296,163"/>
    <path d="M151,145 L214,213"/>
  </g>
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#3A3A3A">
    <text x="302" y="167">1x2 frame</text>
    <text x="200" y="228">¼″-20 insert, ½″ deep</text>
    <text x="200" y="243">— bolt threads into it</text>
  </g>

  <!-- ============ elevations ============ -->
  <!-- face A -->
  <rect x="430" y="100" width="50" height="120" fill="#D9BC8E" stroke="#6B4A2A" stroke-width="1.2"/>
  <rect x="430" y="109" width="16.65" height="15" fill="#9AA0A6" stroke="#5A6066" stroke-width="1"/>
  <line x1="415" y1="100" x2="415" y2="116.5" stroke="#6B6B6B" stroke-width="1"/>
  <polygon points="415,100 411.5,107 418.5,107" fill="#6B6B6B"/>
  <polygon points="415,116.5 411.5,109.5 418.5,109.5" fill="#6B6B6B"/>
  <line x1="428" y1="116.5" x2="413" y2="116.5" stroke="#CFC9BC" stroke-width="1"/>
  <text x="408" y="112" text-anchor="end" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#3A3A3A">½″</text>
  <text x="455" y="90" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#3A3A3A">Face A</text>

  <!-- face B -->
  <rect x="560" y="100" width="50" height="120" fill="#D9BC8E" stroke="#6B4A2A" stroke-width="1.2"/>
  <rect x="560" y="126" width="16.65" height="15" fill="#9AA0A6" stroke="#5A6066" stroke-width="1"/>
  <line x1="545" y1="100" x2="545" y2="133.3" stroke="#6B6B6B" stroke-width="1"/>
  <polygon points="545,100 541.5,107 548.5,107" fill="#6B6B6B"/>
  <polygon points="545,133.3 541.5,126.3 548.5,126.3" fill="#6B6B6B"/>
  <line x1="558" y1="133.3" x2="543" y2="133.3" stroke="#CFC9BC" stroke-width="1"/>
  <text x="538" y="121" text-anchor="end" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#3A3A3A">1″</text>
  <text x="585" y="90" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#3A3A3A">Face B</text>

  <!-- leg width dim -->
  <line x1="430" y1="236" x2="480" y2="236" stroke="#6B6B6B" stroke-width="1"/>
  <polygon points="430,236 438,232.5 438,239.5" fill="#6B6B6B"/>
  <polygon points="480,236 472,232.5 472,239.5" fill="#6B6B6B"/>
  <text x="455" y="254" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#3A3A3A">1½″</text>
  <g stroke="#CFC9BC" stroke-width="1">
    <line x1="430" y1="222" x2="430" y2="240"/>
    <line x1="480" y1="222" x2="480" y2="240"/>
  </g>

  <text x="530" y="282" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7A756B">The two faces are adjacent, not opposite —</text>
  <text x="530" y="298" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7A756B">they are shown side by side here.</text>

  <text x="350" y="332" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" fill="#6B6B6B">The bottom rail repeats the same pattern: Face A 5½″ up from the floor, Face B 5″ up.</text>
</svg>
