<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 600" width="620" height="600" role="img" aria-label="Side section at the kerb showing the post set back so the mailbox face is 6 to 8 inches behind the kerb face, the USPS 41 to 45 inch mail entry band measured from the road surface, and the post buried 30 inches in tamped gravel with no concrete">
  <rect x="0" y="0" width="620" height="600" fill="#FCFBF8"/>
  <rect x="0.5" y="0.5" width="619" height="599" fill="none" stroke="#E4E0D7"/>

  <text x="310" y="32" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#2B2B2B">At the kerb &#8212; setback, datum and footing</text>
  <text x="310" y="50" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7A756B">Street to the left &#183; scale 4.5 px = 1&#8243;</text>

  <!-- USPS entry band -->
  <rect x="40" y="227.5" width="470" height="18" fill="#BFD9C4" opacity="0.5"/>
  <line x1="40" y1="227.5" x2="510" y2="227.5" stroke="#5C8A67" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line x1="40" y1="245.5" x2="510" y2="245.5" stroke="#5C8A67" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="46" y="223" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#3F6349">41&#8211;45&#8243; above the road</text>
  <text x="46" y="259" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#3F6349">the mail drop flap must land in this band</text>

  <!-- road -->
  <rect x="40" y="430" width="170" height="40" fill="#D6D2CA" stroke="#B8B2A6" stroke-width="1"/>
  <line x1="40" y1="430" x2="210" y2="430" stroke="#2B2B2B" stroke-width="2"/>
  <text x="120" y="452" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A5650">road surface</text>

  <!-- kerb -->
  <rect x="210" y="403" width="27" height="67" fill="#CFCAC0" stroke="#8A8578" stroke-width="1"/>
  <!-- ground behind the kerb -->
  <line x1="237" y1="403" x2="580" y2="403" stroke="#2B2B2B" stroke-width="2"/>
  <g stroke="#B8B2A6" stroke-width="1">
    <line x1="250" y1="403" x2="242" y2="413"/><line x1="300" y1="403" x2="292" y2="413"/>
    <line x1="400" y1="403" x2="392" y2="413"/><line x1="450" y1="403" x2="442" y2="413"/>
    <line x1="500" y1="403" x2="492" y2="413"/><line x1="550" y1="403" x2="542" y2="413"/>
  </g>

  <!-- hole: tamped gravel, no concrete -->
  <rect x="249" y="403" width="40" height="135" fill="#E2DDD2" stroke="#B8B2A6" stroke-width="1"/>
  <g fill="#B8B2A6">
    <circle cx="255" cy="420" r="1.6"/><circle cx="283" cy="425" r="1.6"/><circle cx="254" cy="452" r="1.6"/>
    <circle cx="284" cy="462" r="1.6"/><circle cx="256" cy="487" r="1.6"/><circle cx="283" cy="497" r="1.6"/>
    <circle cx="255" cy="520" r="1.6"/><circle cx="284" cy="528" r="1.6"/><circle cx="269" cy="533" r="1.6"/>
  </g>

  <!-- post -->
  <rect x="261" y="157.75" width="16" height="380" fill="#D9BC8E" stroke="#6B4A2A" stroke-width="1.2"/>

  <!-- panel skin on the post face -->
  <rect x="256" y="157.75" width="5" height="155" fill="#F0DCB8" stroke="#6B4A2A" stroke-width="0.8"/>

  <!-- beam -->
  <rect x="258" y="142" width="16" height="16" fill="#C89B6A" stroke="#6B4A2A" stroke-width="1.2"/>

  <!-- solar deck light -->
  <rect x="260" y="136" width="12" height="6" fill="#4A4A4A"/>

  <!-- visor -->
  <g transform="rotate(-20 257.5 160)">
    <rect x="235" y="160" width="22.5" height="4" fill="#C89B6A" stroke="#6B4A2A" stroke-width="0.8"/>
  </g>

  <!-- plaque -->
  <rect x="252" y="181.4" width="4" height="35" fill="#FAF7EF" stroke="#8A8578" stroke-width="0.8"/>

  <!-- mailbox -->
  <rect x="241.5" y="228.85" width="16" height="70.7" fill="#3A3A3A" stroke="#1F1F1F" stroke-width="1"/>
  <rect x="241.5" y="228.85" width="16" height="9" fill="#4E4E4E" stroke="#6E6E6E" stroke-width="0.8"/>

  <!-- setback dimension -->
  <g stroke="#7A756B" stroke-width="0.8" fill="none">
    <path d="M210,340 L241.5,340"/><path d="M210,335 L210,345"/><path d="M241.5,335 L241.5,345"/>
    <path d="M210,403 L210,346" stroke-dasharray="3 3"/>
    <path d="M241.5,299 L241.5,346" stroke-dasharray="3 3"/>
  </g>
  <text x="226" y="333" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5A5650">7&#8243;</text>
  <text x="204" y="360" text-anchor="end" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A5650">kerb face to box face:</text>
  <text x="204" y="374" text-anchor="end" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A5650">6&#8211;8&#8243; (7&#8243; shown)</text>

  <!-- burial dimension -->
  <g stroke="#7A756B" stroke-width="0.8" fill="none">
    <path d="M330,403 L330,538"/><path d="M325,403 L335,403"/><path d="M325,538 L335,538"/>
    <path d="M289,538 L336,538" stroke-dasharray="3 3"/>
  </g>
  <text x="340" y="466" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#2B2B2B">30&#8243; buried</text>
  <text x="340" y="482" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A5650">tamped &#190;&#8243; crushed stone</text>
  <text x="340" y="496" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#8A4A3A">no concrete &#8212; breakaway</text>

  <!-- overall height dimension -->
  <g stroke="#7A756B" stroke-width="0.8" fill="none">
    <path d="M560,142 L560,430"/><path d="M555,142 L565,142"/><path d="M555,430 L565,430"/>
    <path d="M274,142 L561,142" stroke-dasharray="3 3"/>
    <path d="M210,430 L561,430" stroke-dasharray="3 3"/>
  </g>
  <text x="552" y="290" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2B2B2B" transform="rotate(-90 552 290)">64&#8243; above the road</text>

  <!-- G dimension: ground above road -->
  <g stroke="#7A756B" stroke-width="0.8" fill="none">
    <path d="M470,403 L470,430"/><path d="M465,403 L475,403"/><path d="M465,430 L475,430"/>
  </g>
  <text x="482" y="422" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A5650">G &#8212; ground above the road</text>

  <!-- leaders -->
  <g stroke="#7A756B" stroke-width="0.7" fill="none">
    <path d="M266,136 L340,120"/>
    <path d="M243,175 L340,156"/>
    <path d="M252,200 L340,196"/>
    <path d="M243,270 L200,270"/>
  </g>
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A5650">
    <text x="345" y="117">Solar deck light on the beam</text>
    <text x="345" y="153">Lit visor over the plaque</text>
    <text x="345" y="199">Ceramic plaque</text>
  </g>
  <text x="196" y="273" text-anchor="end" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A5650">Mailbox, 4.3&#8243; deep</text>
</svg>
