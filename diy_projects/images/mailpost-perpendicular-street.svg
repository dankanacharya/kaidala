<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 660" width="620" height="660" role="img" aria-label="Street-side elevation of the perpendicular design: standing in the road you see only a three and a half inch post edge, a nine and a quarter inch platform end, and the nine and a half inch mailbox door, with the beam end and one solar deck light above. The much larger envelope of the parallel version is ghosted behind for comparison.">
  <rect x="0" y="0" width="620" height="660" fill="#FCFBF8"/>
  <rect x="0.5" y="0.5" width="619" height="659" fill="none" stroke="#E4E0D7"/>

  <text x="310" y="32" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#2B2B2B">B &#8212; street-side elevation</text>
  <text x="310" y="50" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7A756B">Standing in the road, looking straight at it &#183; heights above the road surface &#183; scale 6 px = 1&#8243;</text>

  <!-- ghosted envelope of the parallel version, for comparison -->
  <rect x="217" y="152" width="186" height="372" fill="#8A8578" opacity="0.07"/>
  <rect x="217" y="152" width="186" height="372" fill="none" stroke="#B0AA9C" stroke-width="1" stroke-dasharray="5 4"/>
  <path d="M217,524 L222,540" stroke="#B0AA9C" stroke-width="0.7" fill="none"/>
  <text x="226" y="544" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#8A8578">envelope of the parallel version, same viewpoint</text>

  <!-- USPS band -->
  <rect x="120" y="242" width="380" height="24" fill="#BFD9C4" opacity="0.5"/>
  <line x1="120" y1="242" x2="500" y2="242" stroke="#5C8A67" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line x1="120" y1="266" x2="500" y2="266" stroke="#5C8A67" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="124" y="238" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#3F6349">USPS 41&#8211;45&#8243;</text>

  <!-- post, seen face-on: 3.5 inches wide -->
  <rect x="299.5" y="221" width="21" height="303" fill="#D9BC8E" stroke="#6B4A2A" stroke-width="1"/>
  <!-- panel zone: side panels flush with the post faces, seen edge-on -->
  <rect x="299.5" y="311" width="21" height="153" fill="#E3CBA3" stroke="#6B4A2A" stroke-width="1"/>
  <line x1="303.25" y1="311" x2="303.25" y2="464" stroke="#A98F63" stroke-width="0.9"/>
  <line x1="316.75" y1="311" x2="316.75" y2="464" stroke="#A98F63" stroke-width="0.9"/>

  <!-- platform end -->
  <rect x="282.25" y="302" width="55.5" height="9" fill="#C89B6A" stroke="#6B4A2A" stroke-width="1"/>

  <!-- mailbox door, face-on -->
  <rect x="281.5" y="245" width="57" height="57" fill="#3A3A3A" stroke="#1F1F1F" stroke-width="1"/>
  <rect x="286" y="249.5" width="48" height="48" fill="#454545" stroke="#6E6E6E" stroke-width="1"/>
  <path d="M281.5,246.5 L338.5,246.5" stroke="#6E6E6E" stroke-width="1"/>
  <rect x="303" y="290" width="14" height="5" fill="#2B2B2B" stroke="#8A8A8A" stroke-width="1"/>

  <!-- outgoing-mail flag on the box side, seen edge-on -->
  <rect x="338.5" y="252" width="4" height="26" fill="#B03A2E" stroke="#7E2A20" stroke-width="0.8"/>

  <!-- beam end -->
  <rect x="299.5" y="200" width="21" height="21" fill="#C89B6A" stroke="#6B4A2A" stroke-width="1"/>

  <!-- solar deck light (the rear one is directly behind, hidden) -->
  <g stroke="#4A4A4A" stroke-width="1">
    <rect x="296.5" y="194" width="27" height="6" fill="#4A4A4A"/>
    <rect x="299.5" y="186" width="21" height="8" fill="#FFF3C4"/>
    <path d="M299.5,186 L310,177 L320.5,186 Z" fill="#4A4A4A"/>
  </g>

  <!-- ground and road -->
  <line x1="150" y1="524" x2="470" y2="524" stroke="#2B2B2B" stroke-width="2"/>
  <g stroke="#B8B2A6" stroke-width="1">
    <line x1="160" y1="524" x2="152" y2="534"/><line x1="200" y1="524" x2="192" y2="534"/>
    <line x1="240" y1="524" x2="232" y2="534"/><line x1="280" y1="524" x2="272" y2="534"/>
    <line x1="320" y1="524" x2="312" y2="534"/><line x1="360" y1="524" x2="352" y2="534"/>
    <line x1="400" y1="524" x2="392" y2="534"/><line x1="440" y1="524" x2="432" y2="534"/>
  </g>
  <line x1="130" y1="560" x2="490" y2="560" stroke="#5A5650" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="310" y="576" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#2B2B2B">road surface &#8212; the datum USPS measures from</text>

  <!-- callouts -->
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#5A5650">
    <g stroke="#7A756B" stroke-width="0.8" fill="none">
      <path d="M323.5,190 L430,176"/>
      <path d="M320.5,210 L430,210"/>
      <path d="M342.5,265 L430,258"/>
      <path d="M338.5,275 L430,300"/>
      <path d="M337.75,307 L430,330"/>
      <path d="M320.5,390 L430,390"/>
      <path d="M320.5,470 L430,470"/>
    </g>
    <text x="435" y="166">Solar deck light &#8212; the second</text>
    <text x="435" y="180">one is directly behind it</text>
    <text x="435" y="207">60&#8243; &#8212; beam end, 3&#189;&#8243;</text>
    <text x="435" y="221">wide from here</text>
    <text x="435" y="255">Outgoing-mail flag,</text>
    <text x="435" y="269">edge-on</text>
    <text x="435" y="297">Mailbox door,</text>
    <text x="435" y="311">9&#189;&#8243; &#215; 9&#189;&#8243;, floor at 43&#8243;</text>
    <text x="435" y="334">2x10 platform end</text>
    <text x="435" y="387">Side panels beyond,</text>
    <text x="435" y="401">flush with the post &#8212;</text>
    <text x="435" y="415">they add no width</text>
    <text x="435" y="467">Both plaques face</text>
    <text x="435" y="481">sideways, invisible</text>
    <text x="435" y="495">from straight on</text>
  </g>

  <!-- width dimensions -->
  <g stroke="#7A756B" stroke-width="0.8" fill="none">
    <path d="M281.5,598 L338.5,598"/><path d="M281.5,593 L281.5,603"/><path d="M338.5,593 L338.5,603"/>
    <path d="M299.5,626 L320.5,626"/><path d="M299.5,621 L299.5,631"/><path d="M320.5,621 L320.5,631"/>
    <path d="M281.5,302 L281.5,596" stroke-dasharray="3 3"/><path d="M338.5,302 L338.5,596" stroke-dasharray="3 3"/>
  </g>
  <text x="310" y="592" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2B2B2B">9&#189;&#8243; at the widest point</text>
  <text x="310" y="648" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#5A5650">3&#189;&#8243; everywhere else</text>

  <!-- height bracket -->
  <g stroke="#7A756B" stroke-width="0.8" fill="none">
    <path d="M200,200 L200,560"/><path d="M195,200 L205,200"/><path d="M195,560 L205,560"/>
    <path d="M299.5,200 L192,200" stroke-dasharray="3 3"/>
  </g>
  <text x="186" y="380" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2B2B2B" transform="rotate(-90 186 380)">60&#8243; above the road</text>
</svg>
