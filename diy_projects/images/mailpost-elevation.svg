<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620" width="620" height="620" role="img" aria-label="Front elevation of the kerbside mailbox post, 31 inches wide, top of beam 64 inches above the road surface, showing the mailbox with its drop flap inside the USPS 41 to 45 inch band, the lit ceramic plaque above it, and the road datum below the ground line">
  <rect x="0" y="0" width="620" height="620" fill="#FCFBF8"/>
  <rect x="0.5" y="0.5" width="619" height="619" fill="none" stroke="#E4E0D7"/>

  <text x="310" y="32" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#2B2B2B">Front elevation &#8212; kerbside</text>
  <text x="310" y="50" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7A756B">All heights above the road surface, not the lawn &#183; scale 6 px = 1&#8243; &#183; shown unfinished</text>

  <!-- USPS entry band, 41-45 inches above the road -->
  <rect x="100" y="270" width="380" height="24" fill="#BFD9C4" opacity="0.5"/>
  <line x1="100" y1="270" x2="480" y2="270" stroke="#5C8A67" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line x1="100" y1="294" x2="480" y2="294" stroke="#5C8A67" stroke-width="0.8" stroke-dasharray="4 3"/>

  <!-- posts -->
  <rect x="217" y="177" width="21" height="327" fill="#D9BC8E" stroke="#6B4A2A" stroke-width="1"/>
  <rect x="382" y="177" width="21" height="327" fill="#D9BC8E" stroke="#6B4A2A" stroke-width="1"/>

  <!-- panel, four 6 inch boards -->
  <g fill="#E3CBA3" stroke="#6B4A2A" stroke-width="1">
    <rect x="238" y="177" width="36" height="207"/>
    <rect x="274" y="177" width="36" height="207"/>
    <rect x="310" y="177" width="36" height="207"/>
    <rect x="346" y="177" width="36" height="207"/>
  </g>

  <!-- beam -->
  <rect x="199" y="156" width="222" height="21" fill="#C89B6A" stroke="#6B4A2A" stroke-width="1"/>
  <line x1="199" y1="172" x2="421" y2="172" stroke="#A87B4A" stroke-width="0.8"/>

  <!-- solar deck lights -->
  <g stroke="#4A4A4A" stroke-width="1">
    <rect x="214" y="150" width="27" height="6" fill="#4A4A4A"/>
    <rect x="217" y="142" width="21" height="8" fill="#FFF3C4"/>
    <path d="M217,142 L227.5,133 L238,142 Z" fill="#4A4A4A"/>
    <rect x="379" y="150" width="27" height="6" fill="#4A4A4A"/>
    <rect x="382" y="142" width="21" height="8" fill="#FFF3C4"/>
    <path d="M382,142 L392.5,133 L403,142 Z" fill="#4A4A4A"/>
  </g>

  <!-- light spill onto the plaque -->
  <path d="M252,187 L368,187 L379,259 L241,259 Z" fill="#FFF3C4" opacity="0.45"/>

  <!-- lit visor -->
  <rect x="250" y="177" width="120" height="10" fill="#C89B6A" stroke="#6B4A2A" stroke-width="1"/>
  <line x1="252" y1="186" x2="368" y2="186" stroke="#E8B93A" stroke-width="2"/>

  <!-- ceramic plaque -->
  <rect x="263" y="208.5" width="94" height="46.5" fill="#FAF7EF" stroke="#8A8578" stroke-width="1"/>
  <rect x="266" y="211.5" width="88" height="40.5" fill="none" stroke="#C9B87A" stroke-width="1.2"/>
  <g fill="#E8B93A">
    <circle cx="273" cy="219" r="3"/><circle cx="347" cy="219" r="3"/>
    <circle cx="273" cy="244" r="3"/><circle cx="347" cy="244" r="3"/>
  </g>
  <text x="310" y="244" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="600" fill="#3A5A78">17</text>

  <!-- mailbox, 29 to 44.7 above the road -->
  <rect x="263" y="271.8" width="94" height="94.2" fill="#3A3A3A" stroke="#1F1F1F" stroke-width="1"/>
  <rect x="267" y="275" width="86" height="14" fill="#4E4E4E" stroke="#6E6E6E" stroke-width="1"/>
  <text x="310" y="286" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9" fill="#D8D8D8">mail drop flap</text>
  <rect x="269" y="295" width="82" height="62" fill="none" stroke="#5E5E5E" stroke-width="1"/>
  <circle cx="310" cy="350" r="3.5" fill="none" stroke="#9A9A9A" stroke-width="1.4"/>
  <text x="310" y="325" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#B9B9B9">locking door</text>

  <!-- ground at the post -->
  <line x1="150" y1="504" x2="470" y2="504" stroke="#2B2B2B" stroke-width="2"/>
  <g stroke="#B8B2A6" stroke-width="1">
    <line x1="156" y1="504" x2="148" y2="514"/><line x1="186" y1="504" x2="178" y2="514"/>
    <line x1="216" y1="504" x2="208" y2="514"/><line x1="246" y1="504" x2="238" y2="514"/>
    <line x1="276" y1="504" x2="268" y2="514"/><line x1="306" y1="504" x2="298" y2="514"/>
    <line x1="336" y1="504" x2="328" y2="514"/><line x1="366" y1="504" x2="358" y2="514"/>
    <line x1="396" y1="504" x2="388" y2="514"/><line x1="426" y1="504" x2="418" y2="514"/>
    <line x1="456" y1="504" x2="448" y2="514"/>
  </g>

  <!-- road datum -->
  <line x1="130" y1="540" x2="490" y2="540" stroke="#5A5650" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="310" y="556" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#2B2B2B">road surface &#8212; the datum USPS measures from</text>
  <g stroke="#7A756B" stroke-width="0.8" fill="none">
    <path d="M170,504 L170,540"/><path d="M165,504 L175,504"/><path d="M165,540 L175,540"/>
  </g>
  <text x="162" y="527" text-anchor="end" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A5650">G</text>

  <!-- right callouts -->
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#5A5650">
    <g stroke="#7A756B" stroke-width="0.8" fill="none">
      <path d="M403,146 L440,120"/>
      <path d="M421,156 L440,156"/>
      <path d="M370,182 L440,136"/>
      <path d="M357,232 L440,232"/>
      <path d="M357,320 L440,320"/>
      <path d="M382,384 L440,384"/>
      <path d="M403,450 L440,450"/>
    </g>
    <text x="445" y="106">Solar deck lights,</text>
    <text x="445" y="120">screw-down base</text>
    <text x="445" y="140">Solar-lit cedar visor</text>
    <text x="445" y="160">64&#8243; &#8212; top of beam</text>
    <text x="445" y="229">Ceramic plaque</text>
    <text x="445" y="243">15&#190;&#8243; &#215; 7&#190;&#8243;, 47&#189;&#8211;55&#188;&#8243;</text>
    <text x="445" y="317">Mailbox 15.7&#8243; sq,</text>
    <text x="445" y="331">29&#8211;44.7&#8243;</text>
    <text x="445" y="388">26&#8243; &#8212; panel bottom</text>
    <text x="445" y="447">4x4 posts, 30&#8243; of</text>
    <text x="445" y="461">tamped gravel &#8212; no concrete</text>
  </g>

  <!-- left height bracket -->
  <g stroke="#7A756B" stroke-width="0.8" fill="none">
    <path d="M190,156 L190,540"/>
    <path d="M185,156 L195,156"/><path d="M185,540 L195,540"/>
    <path d="M199,156 L182,156" stroke-dasharray="3 3"/>
  </g>
  <text x="176" y="348" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2B2B2B" transform="rotate(-90 176 348)">64&#8243; above the road</text>

  <!-- width dimensions -->
  <g stroke="#7A756B" stroke-width="0.8" fill="none">
    <path d="M217,582 L403,582"/><path d="M217,577 L217,587"/><path d="M403,577 L403,587"/>
    <path d="M238,602 L382,602"/><path d="M238,597 L238,607"/><path d="M382,597 L382,607"/>
  </g>
  <text x="310" y="578" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2B2B2B">31&#8243; overall</text>
  <text x="310" y="598" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#5A5650">24&#8243; clear &#8212; four 6&#8243; boards</text>
  <text x="310" y="128" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#5A5650">37&#8243; beam &#8212; 3&#8243; overhang each end</text>
  <text x="196" y="527" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#7A756B">G = height of your ground above the road, typically 4&#8211;8&#8243;</text>
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#3F6349">
    <text x="104" y="254">USPS: point of mail entry</text>
    <text x="104" y="266">41&#8211;45&#8243; above the road</text>
  </g>
</svg>
