<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img">
<title>Isometric wireframe of the assembled Gokulashtami Mantapam</title>
<desc>Isometric line drawing of a 40 by 40 by 70 inch knock-down mantapam: a square 1x2 frame at the top, four upper strips crossing four lower strips to form a 5 by 5 grid, sixteen hooks hanging below the crossings, four 2x2 legs at the inner corners, an optional bottom rail near the floor, and anchor base plates.</desc>
