<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 640" width="620" height="640" role="img" aria-label="Side elevation of the perpendicular design seen from along the road: two posts in line 31 inches apart carrying a beam at 60 inches, the Adoorn mailbox on a platform at 43 inches with its door toward the street on the left, and a ceramic plaque on the side panel below">
  <rect x="0" y="0" width="620" height="640" fill="#FCFBF8"/>
  <rect x="0.5" y="0.5" width="619" height="639" fill="none" stroke="#E4E0D7"/>

  <text x="310" y="32" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#2B2B2B">B &#8212; perpendicular to the street</text>
  <text x="310" y="50" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#7A756B">The side face &#8212; what a car sees on approach &#183; street to the left &#183; scale 6 px = 1&#8243;</text>

  <!-- USPS band -->
  <rect x="60" y="242" width="420" height="24" fill="#BFD9C4" opacity="0.5"/>
  <line x1="60" y1="242" x2="480" y2="242" stroke="#5C8A67" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line x1="60" y1="266" x2="480" y2="266" stroke="#5C8A67" stroke-width="0.8" stroke-dasharray="4 3"/>

  <!-- street arrow -->
  <g stroke="#5A5650" stroke-width="1.4" fill="none">
    <path d="M120,470 L70,470"/><path d="M78,464 L70,470 L78,476"/>
  </g>
  <text x="122" y="474" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#5A5650">street</text>

  <!-- posts, in line front to back -->
  <rect x="217" y="221" width="21" height="303" fill="#D9BC8E" stroke="#6B4A2A" stroke-width="1"/>
  <rect x="382" y="221" width="21" height="303" fill="#D9BC8E" stroke="#6B4A2A" stroke-width="1"/>

  <!-- side panel -->
  <g fill="#E3CBA3" stroke="#6B4A2A" stroke-width="1">
    <rect x="238" y="311" width="36" height="153"/>
    <rect x="274" y="311" width="36" height="153"/>
    <rect x="310" y="311" width="36" height="153"/>
    <rect x="346" y="311" width="36" height="153"/>
  </g>

  <!-- beam over the top, running front to back -->
  <rect x="199" y="200" width="222" height="21" fill="#C89B6A" stroke="#6B4A2A" stroke-width="1"/>
  <line x1="199" y1="216" x2="421" y2="216" stroke="#A87B4A" stroke-width="0.8"/>
  <g stroke="#4A4A4A" stroke-width="1">
    <rect x="214" y="194" width="27" height="6" fill="#4A4A4A"/><rect x="217" y="186" width="21" height="8" fill="#FFF3C4"/>
    <path d="M217,186 L227.5,177 L238,186 Z" fill="#4A4A4A"/>
    <rect x="379" y="194" width="27" height="6" fill="#4A4A4A"/><rect x="382" y="186" width="21" height="8" fill="#FFF3C4"/>
    <path d="M382,186 L392.5,177 L403,186 Z" fill="#4A4A4A"/>
  </g>

  <!-- platform spanning both posts -->
  <rect x="202" y="302" width="216" height="9" fill="#C89B6A" stroke="#6B4A2A" stroke-width="1"/>

  <!-- solar panel on the platform behind the box -->
  <rect x="345" y="294" width="60" height="8" fill="#2E3A4A" stroke="#1F2733" stroke-width="1"/>

  <!-- mailbox: 21 inches long, door at the street end -->
  <rect x="208" y="245" width="126" height="57" fill="#3A3A3A" stroke="#1F1F1F" stroke-width="1"/>
  <path d="M208,251 L334,247" stroke="#6E6E6E" stroke-width="1" fill="none"/>
  <rect x="208" y="245" width="7" height="57" fill="#5E5E5E" stroke="#1F1F1F" stroke-width="1"/>
  <text x="278" y="280" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#B9B9B9">21&#8243; deep &#8212; door to the street</text>

  <!-- light spill -->
  <path d="M252,321 L368,321 L379,400 L241,400 Z" fill="#FFF3C4" opacity="0.45"/>
  <!-- visor under the platform edge -->
  <rect x="250" y="311" width="120" height="10" fill="#C89B6A" stroke="#6B4A2A" stroke-width="1"/>
  <line x1="252" y1="320" x2="368" y2="320" stroke="#E8B93A" stroke-width="2"/>

  <!-- plaque -->
  <rect x="262.5" y="351.5" width="94.5" height="46.5" fill="#FAF7EF" stroke="#8A8578" stroke-width="1"/>
  <rect x="265.5" y="354.5" width="88.5" height="40.5" fill="none" stroke="#C9B87A" stroke-width="1.2"/>
  <g fill="#E8B93A"><circle cx="272" cy="362" r="3"/><circle cx="347" cy="362" r="3"/><circle cx="272" cy="387" r="3"/><circle cx="347" cy="387" r="3"/></g>
  <text x="310" y="387" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="600" fill="#3A5A78">17</text>

  <!-- ground and road -->
  <line x1="150" y1="524" x2="470" y2="524" stroke="#2B2B2B" stroke-width="2"/>
  <g stroke="#B8B2A6" stroke-width="1">
    <line x1="160" y1="524" x2="152" y2="534"/><line x1="200" y1="524" x2="192" y2="534"/>
    <line x1="240" y1="524" x2="232" y2="534"/><line x1="280" y1="524" x2="272" y2="534"/>
    <line x1="320" y1="524" x2="312" y2="534"/><line x1="360" y1="524" x2="352" y2="534"/>
    <line x1="400" y1="524" x2="392" y2="534"/><line x1="440" y1="524" x2="432" y2="534"/>
  </g>
  <line x1="130" y1="560" x2="490" y2="560" stroke="#5A5650" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="310" y="576" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#2B2B2B">road surface &#8212; the datum USPS measures from</text>

  <!-- callouts -->
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" fill="#5A5650">
    <g stroke="#7A756B" stroke-width="0.8" fill="none">
      <path d="M421,200 L442,200"/>
      <path d="M405,298 L442,290"/>
      <path d="M418,306 L442,326"/>
      <path d="M370,316 L442,346"/>
      <path d="M357,375 L442,392"/>
      <path d="M382,464 L442,464"/>
    </g>
    <text x="447" y="190">60&#8243; &#8212; top of beam,</text>
    <text x="447" y="204">with solar deck lights</text>
    <text x="447" y="287">Solar panel, clear</text>
    <text x="447" y="301">of the box</text>
    <text x="447" y="330">2x10 platform on both</text>
    <text x="447" y="344">posts &#8212; no cantilever</text>
    <text x="447" y="368">Lit visor</text>
    <text x="447" y="389">Ceramic plaque,</text>
    <text x="447" y="403">27&#8211;34&#190;&#8243;</text>
    <text x="447" y="461">16&#8243; &#8212; panel bottom</text>
    <text x="447" y="475">(one plaque each side)</text>
  </g>
  <text x="64" y="238" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#3F6349">USPS 41&#8211;45&#8243;</text>
  <text x="64" y="280" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#3F6349">the box floor lands in this band</text>

  <!-- height bracket -->
  <g stroke="#7A756B" stroke-width="0.8" fill="none">
    <path d="M178,200 L178,560"/><path d="M173,200 L183,200"/><path d="M173,560 L183,560"/>
    <path d="M199,200 L170,200" stroke-dasharray="3 3"/>
  </g>
  <text x="164" y="380" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2B2B2B" transform="rotate(-90 164 380)">60&#8243; above the road</text>

  <g stroke="#7A756B" stroke-width="0.8" fill="none">
    <path d="M217,602 L403,602"/><path d="M217,597 L217,607"/><path d="M403,597 L403,607"/>
  </g>
  <text x="310" y="598" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#2B2B2B">31&#8243; deep &#8212; only 3&#189;&#8243; of it faces the road</text>
</svg>
