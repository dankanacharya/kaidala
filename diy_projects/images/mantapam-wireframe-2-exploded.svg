<g font-family="sans-serif" font-size="12" fill="#3d3d3a">
<text x="430" y="94">1. Grid panel</text>
<text x="430" y="112">8 strips, 38 1/2 in each</text>
<text x="430" y="130">16 hooks lock the layers</text>
<text x="430" y="236">2. Top frame</text>
<text x="430" y="254">Two at 40 in, two at 38 1/2 in</text>
<text x="430" y="362">3. Legs</text>
<text x="430" y="380">2 bolts each into inserts</text>
<text x="430" y="442">4. Bottom rail, optional</text>
<text x="430" y="460">Same 4 lengths as the top frame</text>
<text x="430" y="526">Anchor bases, optional</text>
</g>

